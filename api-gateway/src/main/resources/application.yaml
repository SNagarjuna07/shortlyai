spring:
  application:
    name: api-gateway  # service name shown in logs + actuator

  # Redis — rate limiting storage
  data:
    redis:
      host: ${REDIS_HOST:localhost}   # env var with fallback for local dev
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}    # empty locally, set in prod

  # Gateway routes — each service gets its own route
  cloud:
    gateway:
      routes:
        # Auth service — login, register, OAuth2 (no JWT check needed)
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**       # any request starting with /api/auth/

        # URL service — shorten, redirect, delete
        - id: url-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/urls/**

        # Analytics service — click stats, top URLs
        - id: analytics-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/analytics/**

        # AI service — classification, slug, safety
        - id: ai-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/ai/**

server:
  port: 8080  # single entry point — all clients hit this port only

# JWT secret — gateway validates token before routing to any service
jwt:
  secret: ${JWT_SECRET:dev-secret-key-change-in-prod-must-be-256-bits}

# Actuator — expose health + prometheus metrics endpoint
management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: info
    com.shortlyai: DEBUG  # verbose for our code only