api:
  prefix: /api/v1

oauth2:
  redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:9999/oauth2/callback}

spring:
  application:
    name: auth-service
  threads:
    virtual:
      enabled: true

  # Postgres — users, roles, refresh tokens
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:shortlyai_auth}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10           # max DB connections in pool
      minimum-idle: 2                 # keep 2 warm at all times
      connection-timeout: 30000

  # Liquibase — runs migrations on startup before app accepts traffic
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate        # Liquibase owns schema — JPA only validates
    show-sql: false                   # never true in prod — use logs instead
    properties:
      hibernate:
        format_sql: true

  # Redis — refresh token store + blacklisted access tokens
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis123}

  # OAuth2 Google — client credentials from Google Cloud Console
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: email, profile

  # Mail config
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8081

# JWT config — secret shared with gateway (same env var)
jwt:
  secret: ${JWT_SECRET:dev-secret-key-change-in-prod-must-be-256-bits}
  access-token-expiry-ms: 900000      # 15 minutes
  refresh-token-expiry-ms: 604800000  # 7 days

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, info

logging:
  level:
    root: info
    com.shortlyai: DEBUG
    org.springframework.web: DEBUG