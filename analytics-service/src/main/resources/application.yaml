api:
  prefix: /api/v1

spring:
  application:
    name: analytics-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:shortlyai_analytics}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis123}

  # Kafka — consume events published by url-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: analytics-service-group  # consumer group - Kafka tracks offset per group
      auto-offset-reset: earliest         # on first start, read from beginning
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.trusted.packages: "com.shortlyai.*"  # whitelist our event classes
        reconnect.backoff.ms: 1000  # wait 1s before reconnect attempt
        reconnect.backoff.max.ms: 10000  # max 10s between reconnect attempts
    topics:
      url-created: ${URL_CREATED_EVENT:url.created}
      url-clicked: ${URL_CLICKED_EVENT:url.clicks}
      url-deleted: ${URL_DELETED_EVENT:url.deleted}

eureka:
  client:
    service-url:
      # EUREKA_URL overridden to http://eureka-server:8761/eureka/ in Docker Compose
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 10  # refresh instance list every 10s (default 30)
  instance:
    prefer-ip-address: true                  # register with IP not hostname — required in Docker
    lease-renewal-interval-in-seconds: 10    # heartbeat every 10s (default 30)
    lease-expiration-duration-in-seconds: 30 # Eureka marks dead after 30s no heartbeat

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, info

  endpoint:
    health:
      show-details: always

  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: info
    com.shortlyai: DEBUG

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs