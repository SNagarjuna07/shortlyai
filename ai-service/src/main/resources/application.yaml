api:
  prefix: /api/v1

spring:
  application:
    name: ai-service

  ai:
    openai:
      api-key: ${GROQ_API_KEY:}
      base-url: ${GROQ_BASE_URL:https://api.groq.com/openai}
      chat:
        model: ${GROQ_MODEL:llama-3.3-70b-versatile}
        temperature: ${GROQ_TEMPERATURE:0.3}
        max-tokens: ${GROQ_MAX_TOKENS:100}

    mcp:
      server:
        enabled: true
        name: shortlyai-mcp-server
        version: 1.0.0
        protocol: STREAMABLE
        type: sync
        capabilities:
          completion: true
          prompt: true
          resource: true
          tool: true
        request-timeout: 50s

  # Redis - MCP API key validation (McpKeyFilter reads mcp:key:{hash} → userId)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis123}

  kafka:
    template:
      observation-enabled: true
    listener:
      observation-enabled: true

    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        max.block.ms: 3000          # fail fast if Kafka unreachable (default 60s blocks HTTP)
        retries: 3
        retry.backoff.ms: 1000

    consumer:
      group-id: ai-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        reconnect.backoff.ms: 1000
        reconnect.backoff.max.ms: 10000

  threads:
    virtual:
      enabled: true

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, info

  health:
    circuitbreakers:
      enabled: true   # CB state shows in /actuator/health

  endpoint:
    health:
      show-details: always

  metrics:
    tags:
      application: ${spring.application.name}

  tracing:
    sampling:
      probability: 1.0        # 100% in dev, drop to 0.1 in prod

  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces

  otlp:
    metrics:
      export:
        enabled: false

logging:
  level:
    root: info
    com.shortlyai: DEBUG
    org.springframework.ai: DEBUG
    org.apache.kafka.common.config: OFF

services:
  url-service:
    base-url: ${URL_SERVICE_BASE_URL:http://localhost:8082}
  analytics-service:
    base-url: ${ANALYTICS_SERVICE_BASE_URL:http://localhost:8083}

eureka:
  client:
    service-url:
      # EUREKA_URL overridden to http://eureka-server:8761/eureka/ in Docker Compose
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 10  # refresh instance list every 10s (default 30)
  instance:
    prefer-ip-address: true                  # register with IP not hostname — required in Docker
    lease-renewal-interval-in-seconds: 10    # heartbeat every 10s (default 30)
    lease-expiration-duration-in-seconds: 30 # Eureka marks dead after 30s no heartbeat

resilience4j:
  timelimiter:
    instances:
      url-service:
        timeout-duration: 30s
        cancel-running-future: false

      analytics-service:
        timeout-duration: 30s
        cancel-running-future: false

      ai-service:
        timeout-duration: 30s
        cancel-running-future: false

      ai-agent:
        timeout-duration: 45s   # allows for multistep tool-calling, not just one completion
        cancel-running-future: false

  circuitbreaker:
    instances:
      ai-service:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        slowCallDurationThreshold: 15s
        slowCallRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        # 4xx (not found, conflict) - rethrow untouched, no fallback,
        # doesn't count toward circuit stats
        ignoreExceptions:
          - org.springframework.web.client.HttpClientErrorException
        # connection issues + 5xx - count toward circuit state, trigger fallback
        recordExceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
          - java.util.concurrent.TimeoutException

      url-service:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        slowCallDurationThreshold: 2s
        slowCallRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        # 4xx (not found, conflict) - rethrow untouched, no fallback,
        # doesn't count toward circuit stats
        ignoreExceptions:
          - org.springframework.web.client.HttpClientErrorException
        # connection issues + 5xx - count toward circuit state, trigger fallback
        recordExceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
          - java.util.concurrent.TimeoutException

      analytics-service:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        slowCallDurationThreshold: 2s
        slowCallRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        ignoreExceptions:
          - org.springframework.web.client.HttpClientErrorException
        recordExceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
          - java.util.concurrent.TimeoutException

      ai-agent:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        slowCallDurationThreshold: 40s   # a bit under the 45s timelimiter, catches "slow" before "hung"
        slowCallRateThreshold: 50

  retry:
    instances:
      url-service:
        maxAttempts: 3
        waitDuration: 500ms
        retryExceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException

      analytics-service:
        maxAttempts: 3
        waitDuration: 500ms
        retryExceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException

      ai-service:
        maxAttempts: 3
        waitDuration: 500ms
        retryExceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException

      ai-agent:
        maxAttempts: 2
        waitDuration: 500ms
        retryExceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs