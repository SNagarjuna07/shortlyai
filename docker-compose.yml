# docker-compose.yml — project root
version: '3.8'

services:

  # ════════════════════════════════════════════════════════════════════
  # POSTGRES 16 — unchanged
  # ════════════════════════════════════════════════════════════════════
  postgres:
    image: postgres:16
    container_name: shortlyai-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGTZ: Asia/Kolkata
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ════════════════════════════════════════════════════════════════════
  # REDIS STACK — unchanged
  # ════════════════════════════════════════════════════════════════════
  redis:
    image: redis/redis-stack:latest
    container_name: shortlyai-redis
    environment:
      REDIS_ARGS: "--requirepass redis123"
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "redis123", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ════════════════════════════════════════════════════════════════════
  # ZOOKEEPER — unchanged
  # ════════════════════════════════════════════════════════════════════
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: shortlyai-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  # ════════════════════════════════════════════════════════════════════
  # KAFKA — unchanged
  # NOTE: app containers below use "kafka:29092" (internal listener) —
  # they're now Docker containers too, same as kafka-ui.
  # ════════════════════════════════════════════════════════════════════
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: shortlyai-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
      KAFKA_LOG_RETENTION_HOURS: 168
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ════════════════════════════════════════════════════════════════════
  # KAFKA UI — unchanged
  # ════════════════════════════════════════════════════════════════════
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: shortlyai-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  # ════════════════════════════════════════════════════════════════════
  # EUREKA SERVER
  # Fixed: dockerfile path was "DockerFile" (wrong case) -> "Dockerfile"
  # Removed misplaced EUREKA_URL env (that var belongs to CLIENT services,
  # not the server itself)
  # ════════════════════════════════════════════════════════════════════
  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    container_name: shortlyai-eureka
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8761' || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s   # Eureka takes ~30s to fully start

  # ════════════════════════════════════════════════════════════════════
  # API-GATEWAY :8080
  # Entry point — routes to all 4 services via Eureka service discovery
  # depends_on conditions: waits for infra to be HEALTHY, not just started
  # ════════════════════════════════════════════════════════════════════
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: shortlyai-api-gateway
    ports:
      - "8080:8080"
    env_file:
      - .env                          # pulls JWT_SECRET, REDIS_PASSWORD etc
    environment:
      REDIS_HOST: redis                # Docker DNS — resolves to redis container
      EUREKA_URL: http://eureka-server:8761/eureka/
    depends_on:
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  # ════════════════════════════════════════════════════════════════════
  # AUTH-SERVICE :8081
  # ⚠ REQUIRES .env to have MAIL_USERNAME + MAIL_PASSWORD set —
  # these have NO defaults in application.yaml. Missing them =
  # startup crash (placeholder resolution failure).
  # ════════════════════════════════════════════════════════════════════
  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: shortlyai-auth-service
    ports:
      - "8081:8081"
    env_file:
      - .env                          # JWT_SECRET, DB_USER/PASS, REDIS_PASS,
      # GOOGLE_CLIENT_ID/SECRET, MAIL_USERNAME/PASSWORD
    environment:
      DB_HOST: postgres
      DB_NAME: shortlyai_auth
      REDIS_HOST: redis
      EUREKA_URL: http://eureka-server:8761/eureka/
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  # ════════════════════════════════════════════════════════════════════
  # URL-SERVICE :8082
  # KAFKA_BOOTSTRAP_SERVERS overridden to internal listener (kafka:29092) —
  # this container talks to kafka over Docker network, not localhost
  # ════════════════════════════════════════════════════════════════════
  url-service:
    build:
      context: .
      dockerfile: url-service/Dockerfile
    container_name: shortlyai-url-service
    ports:
      - "8082:8082"
    env_file:
      - .env                          # JWT_SECRET, DB_USER/PASS, REDIS_PASS
    environment:
      DB_HOST: postgres
      DB_NAME: shortlyai_urls
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_URL: http://eureka-server:8761/eureka/
      # BASE_DOMAIN left at default (http://localhost:8082) —
      # short URLs are clicked from the HOST browser, localhost:8082
      # still resolves correctly via the port mapping above
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  # ════════════════════════════════════════════════════════════════════
  # ANALYTICS-SERVICE :8083
  # ════════════════════════════════════════════════════════════════════
  analytics-service:
    build:
      context: .
      dockerfile: analytics-service/Dockerfile
    container_name: shortlyai-analytics-service
    ports:
      - "8083:8083"
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_NAME: shortlyai_analytics
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_URL: http://eureka-server:8761/eureka/
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  # ════════════════════════════════════════════════════════════════════
  # AI-SERVICE :8084
  # No DB. Calls url-service + analytics-service by Docker DNS name
  # (not localhost — those are now separate containers on the same network)
  # ⚠ REQUIRES .env to have GROQ_BASE_URL, GROQ_MODEL, GROQ_TEMPERATURE,
  # GROQ_MAX_TOKENS set — NO defaults in application.yaml, missing =
  # startup crash.
  # ════════════════════════════════════════════════════════════════════
  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    container_name: shortlyai-ai-service
    ports:
      - "8084:8084"
    env_file:
      - .env                          # GROQ_API_KEY/BASE_URL/MODEL/TEMPERATURE/MAX_TOKENS
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_URL: http://eureka-server:8761/eureka/
      URL_SERVICE_BASE_URL: http://url-service:8082         # Docker DNS, not localhost
      ANALYTICS_SERVICE_BASE_URL: http://analytics-service:8083
    depends_on:
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  # ════════════════════════════════════════════════════════════════════
  # OBSERVABILITY — unchanged
  # ════════════════════════════════════════════════════════════════════
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml
      - D:/Coding/SpringBoot/shortlyai:/app:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  grafana-data: