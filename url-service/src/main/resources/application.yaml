api:
  prefix: /api/v1

spring:
  application:
    name: url-service

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:shortlyai_urls}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 20           # higher — URL redirect is high traffic
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true

  # Redis — cache-aside: check Redis before hitting Postgres on redirect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis123}

  # Kafka — publish url.created + url.deleted events
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all
      properties:
        spring.json.add.type.headers: false # wait for all replicas — no data loss
        max.block.ms: 3000  # fail fast in 3s instead of blocking 60s
        reconnect.backoff.ms: 1000      # wait 1s before reconnect attempt
        reconnect.backoff.max.ms: 10000 # max 10s between reconnect attempts
        retry.backoff.ms: 1000      # wait 1s between retries
      retries: 3
    topics:
      url-created: ${URL_CREATED_EVENT:url.created}
      url-clicked: ${URL_CLICKED_EVENT:url.clicks}
      url-deleted: ${URL_DELETED_EVENT:url.deleted}


server:
  port: 8082

# JWT — validate token forwarded by gateway
jwt:
  secret: ${JWT_SECRET:dev-secret-key-change-in-prod-must-be-256-bits}

# OpenFeign — base URL for ai-service calls
ai-service:
  url: ${AI_SERVICE_URL:http://localhost:8084}

# URL config
url:
  base-domain: ${BASE_DOMAIN:http://localhost:8082}  # prepended to slug
  slug-length: 7                      # Base62 slug character count
  default-expiry-days: 30             # URLs expire after 30 days if no expiry set
  cache-ttl-seconds: 3600             # Redis TTL for cached URLs

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, info

logging:
  level:
    root: info
    com.shortlyai: DEBUG

  structured:
    format:
      console: logstash